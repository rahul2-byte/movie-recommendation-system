name: Deploy Backend to AWS Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "template.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run quality gates
        run: |
          uv run --frozen ruff check backend
          PYTHONPATH=backend uv run --frozen pytest backend/tests/unit -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Lambda image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: movie-recommendation-backend
          IMAGE_TAG: ${{ github.sha }}
          MODEL_BUNDLE_PATH: backend/model_bundle/movielens-32m-4retriever-ranker-v1
        run: |
          test -f "$MODEL_BUNDLE_PATH/bundle_manifest.json"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f backend/Dockerfile.lambda \
            --build-arg MODEL_BUNDLE_PATH=$MODEL_BUNDLE_PATH \
            . \
            --push

      - name: Verify image exists in ECR
        env:
          ECR_REPOSITORY: movie-recommendation-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --region ap-south-1 >/dev/null

      - name: Deploy with SAM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: movie-recommendation-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sam deploy --template-file template.yaml \
            --stack-name movie-rec-stack \
            --region ap-south-1 \
            --capabilities CAPABILITY_IAM \
            --image-repository $ECR_REGISTRY/$ECR_REPOSITORY \
            --parameter-overrides \
              S3BucketName=${{ secrets.S3_BUCKET_NAME }} \
              Environment=PROD \
              AllowedOrigins="${{ secrets.ALLOWED_ORIGINS }}" \
              ImageUri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
              TmdbAccessToken=${{ secrets.TMDB_ACCESS_TOKEN }} \
              ImdbApiKey=${{ secrets.IMDB_API_KEY }} \
            --no-confirm-changeset
