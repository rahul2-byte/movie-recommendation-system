[project]
name = "movie-recommendation-system"
version = "0.1.0"
description = "Movie recommendation API, offline training, and evaluation project"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiohttp",
    "faiss-cpu==1.7.4",
    "fastapi",
    "joblib",
    "lightgbm==3.3.5",
    "loguru",
    "mangum",
    "numpy<2",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "scikit-learn",
    "scipy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]
training = [
    "implicit",
    "mlflow",
    "pandas",
    "pyarrow==12.0.1",
    "torch==2.5.1+cpu",
]

[tool.uv]
package = false
default-groups = ["dev", "training"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["E402"]
"backend/scripts/data_enrichment/run_movie_enrichment.py" = ["E402"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
