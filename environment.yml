name: rsys
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # ---- Core ----
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - tqdm

  # ---- Notebooks ----
  - jupyterlab
  - notebook

  # ---- ML / Reco ----
  - gensim
  - lightgbm
  - polars

  # ---- Parquet (modern replacement) ----
  - pyarrow

  # ---- PyTorch + CUDA (correct way) ----
  - pytorch=2.5.1
  - torchvision=0.20.1
  - torchaudio=2.5.1
  - pytorch-cuda=12.1

  # ---- FAISS ----
  - faiss-gpu

  # ---- Backend / API ----
  - fastapi
  - uvicorn
  - streamlit
  - aiohttp
  - requests
  - python-dotenv

  # ---- Pip-only ----
  - pip
  - pip:
      - implicit

