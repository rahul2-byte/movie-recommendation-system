AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Movie Recommendation System API
  Deployed as a Docker-based Lambda function.

Parameters:
  ImageUri:
    Type: String
    Description: URI of the Docker image in ECR
  DynamoDBTableName:
    Type: String
    Default: Movies
    Description: DynamoDB table name for movie metadata.
  S3BucketName:
    Type: String
    Description: Name of the S3 bucket containing model artifacts and data.
  TmdbAccessToken:
    Type: String
    Description: TMDB API Access Token
    NoEcho: true
  ImdbApiKey:
    Type: String
    Description: OMDb/IMDb API Key
    NoEcho: true
  Environment:
    Type: String
    Default: PROD
    AllowedValues: [LOCAL, PROD]

Globals:
  Function:
    Timeout: 60
    MemorySize: 2048 # Recommended due to FAISS and LightGBM memory usage

Resources:
  MovieRecommendationApi:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - x86_64
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ProxyApiGreedy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          S3_BUCKET: !Ref S3BucketName
          S3_ARTIFACT_BUCKET: !Ref S3BucketName
          AWS_REGION: !Ref AWS::Region
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTableName
          TMDB_ACCESS_TOKEN: !Ref TmdbAccessToken
          IMDB_API_KEY: !Ref ImdbApiKey
          LOG_LEVEL: INFO
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref S3BucketName
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}"
                - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDBTableName}/index/*"

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
