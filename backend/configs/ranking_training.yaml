random_seed: 42

packing:
  output_dir: backend/artifacts/ranking_packed

model:
  objective: lambdarank
  metric: ndcg
  ndcg_ks: [5, 10]
  learning_rate: 0.05
  num_leaves: 31
  min_data_in_leaf: 20
  lambda_l2: 1.0
  num_boost_round: 300
  early_stopping_rounds: 30
  num_threads: 0
  rrf_rank_constant: 60

tracking:
  experiment_name: ranking_training
