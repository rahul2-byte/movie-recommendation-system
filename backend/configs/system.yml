# backend/configs/system.yml
# Central configuration for file paths, service URLs, and MLflow settings.

# Central configuration for file paths, service URLs, and MLflow settings.

# --- Data Storage (AWS) ---
storage:
  dynamodb_table: "${settings.DYNAMODB_TABLE_NAME}"
  artifact_bucket: "${settings.S3_ARTIFACT_BUCKET}"
  # Local ephemeral cache for downloaded S3 artifacts
  artifact_cache_dir: "/tmp/movie_artifacts"

# --- Model Artifacts (S3 Keys) ---
# Models allow simple key lookups. The code will prefix with s3://{bucket}/
model_registry:
  ranker:
    model_key: "artifacts/models/ranker/lgbm_lambdarank.txt"
  
  retrieval:
    tfidf:
      embeddings_key: "artifacts/models/tfidf/item_embeddings.npy"
      faiss_index_key: "artifacts/models/tfidf/faiss.index"
      id_map_key: "artifacts/models/tfidf/movie_id_to_idx.json"
    
    content_based:
      embeddings_key: "artifacts/models/content_based/item_embeddings.npy"
      faiss_index_key: "artifacts/models/content_based/faiss.index"
      id_map_key: "artifacts/models/content_based/movie_id_to_idx.json"
      preprocessors_key: "artifacts/models/content_based/preprocessors.pkl"

    als:
      embeddings_key: "artifacts/models/als/item_embeddings.npy"
      faiss_index_key: "artifacts/models/als/faiss.index"
      id_map_key: "artifacts/models/als/movie_id_to_idx.json"

    two_tower:
      item_encoder_key: "artifacts/models/two_tower/item_encoder.pth"
      embeddings_key: "artifacts/models/two_tower/item_embeddings.npy"
      faiss_index_key: "artifacts/models/two_tower/faiss.index"
      id_map_key: "artifacts/models/two_tower/movie_id_to_idx.json"
      preprocessors_key: "artifacts/models/two_tower/feature_preprocessors.pkl"
      embedding_dim: 64

# --- Retrieval Hyperparameters ---
retrieval_params:
  two_tower:
    epochs: 5
    batch_size: 256
    learning_rate: 0.001
    num_negatives: 4 

# --- MLflow Tracking ---
tracking:
  ranker_experiment_name: "movie_query_ranker"
  retrieval_experiment_name: "movie_retrieval_models"

# --- Legacy Script Compatibility ---
# All paths here are relative to backend/ service root.
data_root: "data"
movies_metadata_path: "${data_root}/processed/movies_enriched.parquet"
ratings_path: "${data_root}/processed/ratings.parquet"
tags_path: "${data_root}/processed/tags.parquet"
training_sequences_path: "${data_root}/processed/training_sequences.parquet"
training_dataset_path: "${data_root}/processed/ranking_dataset.parquet"
ranker_model_dir: "artifacts/models/ranker"

retrieval_artifacts:
  tfidf:
    model_dir: "artifacts/models/tfidf"
    embeddings_path: "artifacts/models/tfidf/item_embeddings.npy"
    faiss_index_path: "artifacts/models/tfidf/faiss.index"
    id_map_path: "artifacts/models/tfidf/movie_id_to_idx.json"
  content_based:
    model_dir: "artifacts/models/content_based"
    embeddings_path: "artifacts/models/content_based/item_embeddings.npy"
    faiss_index_path: "artifacts/models/content_based/faiss.index"
    id_map_path: "artifacts/models/content_based/movie_id_to_idx.json"
  als:
    model_dir: "artifacts/models/als"
    embeddings_path: "artifacts/models/als/item_embeddings.npy"
    faiss_index_path: "artifacts/models/als/faiss.index"
    id_map_path: "artifacts/models/als/movie_id_to_idx.json"
  two_tower:
    model_dir: "artifacts/models/two_tower"
    embeddings_path: "artifacts/models/two_tower/item_embeddings.npy"
    faiss_index_path: "artifacts/models/two_tower/faiss.index"
    id_map_path: "artifacts/models/two_tower/movie_id_to_idx.json"
